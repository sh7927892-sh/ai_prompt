<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>나의 AI 프롬프트 창고</title>
    <meta name="description" content="초보자를 위한 깔끔한 AI 이미지 프롬프트 모음 및 관리 웹앱" />
    <meta property="og:title" content="나의 AI 프롬프트 창고" />
    <meta property="og:description" content="초보자를 위한 깔끔한 AI 이미지 프롬프트 모음 및 관리 웹앱" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-page: #ffffff;
        --bg-subtle: #f8fafc;
        --bg-surface: #ffffff;
        --bg-hover: #fffbeb;
        --navy-900: #0f2347;
        --navy-800: #16305c;
        --navy-700: #254170;
        --text-body: #334155;
        --text-muted: #64748b;
        --border-light: #e2e8f0;
        --border-hover: #cbd5e1;
        --accent-yellow: #fbbf24;
        --accent-yellow-hover: #f59e0b;
        --accent-yellow-soft: #fef3c7;
        --accent-yellow-border: #fde68a;
        --danger: #dc2626;
        --danger-soft: #fef2f2;
        --success: #0f766e;
        --success-soft: #f0fdfa;
        --radius-sm: 8px;
        --radius-md: 12px;
        --radius-lg: 16px;
        --shadow-card: 0 2px 8px rgba(15, 35, 71, 0.04);
        --shadow-card-hover: 0 10px 24px rgba(15, 35, 71, 0.08);
        --shadow-modal: 0 24px 48px rgba(15, 35, 71, 0.18);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html {
        font-family: 'Plus Jakarta Sans', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
        color: var(--navy-900);
        background-color: var(--bg-page);
        -webkit-font-smoothing: antialiased;
        line-height: 1.6;
      }

      body {
        min-height: 100vh;
        background-color: var(--bg-page);
        color: var(--navy-900);
      }

      button,
      input,
      textarea,
      select {
        font-family: inherit;
        color: inherit;
      }

      button {
        cursor: pointer;
        border: none;
        background: none;
      }

      button:focus-visible,
      input:focus-visible,
      textarea:focus-visible,
      select:focus-visible {
        outline: 2px solid var(--accent-yellow-hover);
        outline-offset: 2px;
      }

      /* Top Header */
      .site-header {
        position: sticky;
        top: 0;
        z-index: 30;
        background-color: rgba(255, 255, 255, 0.94);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--border-light);
      }

      .header-inner {
        max-width: 1160px;
        margin: 0 auto;
        padding: 16px 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        flex-wrap: wrap;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        text-decoration: none;
        color: var(--navy-900);
        flex-shrink: 0;
      }

      .brand-mark {
        width: 38px;
        height: 38px;
        border-radius: 10px;
        background-color: var(--accent-yellow);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        box-shadow: inset 0 -2px 0 rgba(15, 35, 71, 0.12);
      }

      .brand-title {
        font-size: 20px;
        font-weight: 800;
        letter-spacing: -0.02em;
        color: var(--navy-900);
        white-space: nowrap;
      }

      .header-actions {
        display: flex;
        align-items: center;
        gap: 12px;
        flex: 1;
        justify-content: flex-end;
        min-width: 260px;
      }

      .search-box {
        position: relative;
        flex: 1;
        max-width: 400px;
        min-width: 200px;
      }

      .search-icon {
        position: absolute;
        left: 14px;
        top: 50%;
        transform: translateY(-50%);
        font-size: 15px;
        pointer-events: none;
        opacity: 0.7;
      }

      .search-input {
        width: 100%;
        height: 42px;
        padding: 0 38px 0 40px;
        background-color: var(--bg-subtle);
        border: 1px solid var(--border-light);
        border-radius: var(--radius-sm);
        font-size: 14px;
        color: var(--navy-900);
        transition: border-color 150ms ease, background-color 150ms ease, box-shadow 150ms ease;
      }

      .search-input::placeholder {
        color: var(--text-muted);
      }

      .search-input:focus {
        background-color: #ffffff;
        border-color: var(--navy-900);
        outline: none;
        box-shadow: 0 0 0 3px var(--accent-yellow-soft);
      }

      .search-clear {
        position: absolute;
        right: 8px;
        top: 50%;
        transform: translateY(-50%);
        width: 26px;
        height: 26px;
        border-radius: 6px;
        display: none;
        align-items: center;
        justify-content: center;
        font-size: 13px;
        color: var(--text-muted);
      }

      .search-clear.visible {
        display: inline-flex;
      }

      .search-clear:hover {
        background-color: var(--border-light);
        color: var(--navy-900);
      }

      .btn-primary {
        height: 42px;
        padding: 0 18px;
        border-radius: var(--radius-sm);
        background-color: var(--accent-yellow);
        color: var(--navy-900);
        font-size: 14px;
        font-weight: 700;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        white-space: nowrap;
        flex-shrink: 0;
        box-shadow: inset 0 -2px 0 rgba(15, 35, 71, 0.12);
        transition: background-color 150ms ease, transform 120ms ease;
      }

      .btn-primary:hover {
        background-color: var(--accent-yellow-hover);
      }

      .btn-primary:active {
        transform: translateY(1px);
      }

      /* Main Container */
      .main-container {
        max-width: 1160px;
        margin: 0 auto;
        padding: 32px 24px 64px;
      }

      /* Intro & Controls Bar */
      .toolbar {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 28px;
        padding-bottom: 22px;
        border-bottom: 1px solid var(--border-light);
        flex-wrap: wrap;
      }

      .toolbar-intro h1 {
        font-size: clamp(22px, 2.6vw, 28px);
        font-weight: 800;
        letter-spacing: -0.025em;
        color: var(--navy-900);
        margin-bottom: 6px;
        text-wrap: balance;
      }

      .toolbar-intro p {
        font-size: 14px;
        color: var(--text-muted);
      }

      .filter-bar {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }

      .filter-btn {
        min-height: 40px;
        padding: 8px 16px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--border-light);
        background-color: var(--bg-surface);
        color: var(--text-body);
        font-size: 14px;
        font-weight: 600;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        white-space: nowrap;
        transition: all 150ms ease;
      }

      .filter-btn:hover {
        border-color: var(--navy-900);
        color: var(--navy-900);
        background-color: var(--bg-subtle);
      }

      .filter-btn.active {
        background-color: var(--navy-900);
        border-color: var(--navy-900);
        color: #ffffff;
      }

      .filter-btn.active .filter-count {
        color: var(--accent-yellow);
      }

      .filter-count {
        font-variant-numeric: tabular-nums;
        font-size: 12px;
        font-weight: 700;
        color: var(--text-muted);
      }

      /* Summary Strip */
      .result-summary {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 16px;
        font-size: 13px;
        color: var(--text-muted);
      }

      .result-summary strong {
        color: var(--navy-900);
        font-variant-numeric: tabular-nums;
      }

      /* Prompt Cards Grid */
      .prompt-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
        gap: 20px;
      }

      .prompt-card {
        background-color: var(--bg-surface);
        border: 1px solid var(--border-light);
        border-radius: var(--radius-md);
        padding: 22px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: 16px;
        box-shadow: var(--shadow-card);
        cursor: pointer;
        transition: transform 160ms cubic-bezier(0.16, 1, 0.3, 1),
          box-shadow 160ms ease,
          border-color 160ms ease;
      }

      .prompt-card:hover {
        transform: translateY(-2px);
        box-shadow: var(--shadow-card-hover);
        border-color: var(--navy-700);
      }

      .prompt-card:focus-visible {
        outline: 2px solid var(--accent-yellow-hover);
        outline-offset: 2px;
      }

      .card-top {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      /* Clean unboxed metadata per design standards */
      .card-meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        font-size: 12.5px;
        font-weight: 600;
        color: var(--text-muted);
      }

      .card-meta-left {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: var(--navy-700);
      }

      .card-meta-num {
        font-variant-numeric: tabular-nums;
        color: var(--text-muted);
        font-weight: 500;
      }

      .card-title {
        font-size: 18px;
        font-weight: 700;
        line-height: 1.35;
        color: var(--navy-900);
        letter-spacing: -0.015em;
        word-break: keep-all;
      }

      .card-preview {
        font-size: 14px;
        line-height: 1.62;
        color: var(--text-body);
        white-space: pre-line;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
        word-break: break-word;
      }

      .card-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding-top: 14px;
        border-top: 1px solid var(--border-light);
      }

      .card-hint {
        font-size: 12.5px;
        font-weight: 500;
        color: var(--text-muted);
      }

      .btn-copy {
        min-height: 36px;
        padding: 6px 14px;
        border-radius: var(--radius-sm);
        background-color: var(--accent-yellow-soft);
        border: 1px solid var(--accent-yellow-border);
        color: var(--navy-900);
        font-size: 13px;
        font-weight: 700;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        white-space: nowrap;
        flex-shrink: 0;
        transition: background-color 150ms ease, border-color 150ms ease, transform 120ms ease;
      }

      .btn-copy:hover {
        background-color: var(--accent-yellow);
        border-color: var(--accent-yellow-hover);
      }

      .btn-copy.copied {
        background-color: var(--navy-900);
        border-color: var(--navy-900);
        color: #ffffff;
      }

      /* Loading & Empty States */
      .state-box {
        border: 1px dashed var(--border-hover);
        border-radius: var(--radius-lg);
        background-color: var(--bg-subtle);
        padding: 56px 24px;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }

      .state-emoji {
        font-size: 40px;
        line-height: 1;
      }

      .state-title {
        font-size: 17px;
        font-weight: 700;
        color: var(--navy-900);
      }

      .state-desc {
        font-size: 14px;
        color: var(--text-muted);
        max-width: 420px;
      }

      .skeleton-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
        gap: 20px;
      }

      .skeleton-card {
        border: 1px solid var(--border-light);
        border-radius: var(--radius-md);
        padding: 22px;
        height: 220px;
        background: linear-gradient(90deg, #f8fafc 25%, #f1f5f9 50%, #f8fafc 75%);
        background-size: 200% 100%;
        animation: shimmer 1.4s infinite;
      }

      @keyframes shimmer {
        0% {
          background-position: 200% 0;
        }
        100% {
          background-position: -200% 0;
        }
      }

      /* Modals */
      .modal-backdrop {
        position: fixed;
        inset: 0;
        z-index: 60;
        background-color: rgba(15, 35, 71, 0.55);
        backdrop-filter: blur(3px);
        display: none;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .modal-backdrop.open {
        display: flex;
        animation: fadeIn 150ms ease;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      .modal-dialog {
        width: 100%;
        max-width: 740px;
        max-height: 88vh;
        background-color: #ffffff;
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-modal);
        border: 1px solid var(--border-light);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        animation: popIn 180ms cubic-bezier(0.16, 1, 0.3, 1);
      }

      @keyframes popIn {
        from {
          opacity: 0;
          transform: translateY(10px) scale(0.985);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      .modal-header {
        padding: 20px 24px;
        border-bottom: 1px solid var(--border-light);
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
        background-color: #ffffff;
      }

      .modal-meta {
        font-size: 13px;
        font-weight: 600;
        color: var(--navy-700);
        margin-bottom: 4px;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .modal-title {
        font-size: 21px;
        font-weight: 800;
        color: var(--navy-900);
        line-height: 1.3;
        letter-spacing: -0.015em;
      }

      .modal-close {
        width: 36px;
        height: 36px;
        border-radius: var(--radius-sm);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        color: var(--text-muted);
        flex-shrink: 0;
        transition: background-color 150ms ease, color 150ms ease;
      }

      .modal-close:hover {
        background-color: var(--bg-subtle);
        color: var(--navy-900);
      }

      .modal-body {
        padding: 24px;
        overflow-y: auto;
        flex: 1;
        background-color: var(--bg-subtle);
      }

      .prompt-full-content {
        background-color: #ffffff;
        border: 1px solid var(--border-light);
        border-radius: var(--radius-md);
        padding: 22px;
        font-size: 15px;
        line-height: 1.75;
        color: var(--navy-900);
        white-space: pre-wrap;
        word-break: break-word;
      }

      .modal-footer {
        padding: 16px 24px;
        border-top: 1px solid var(--border-light);
        background-color: #ffffff;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
      }

      .modal-footer-left {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }

      .modal-footer-right {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .btn-secondary {
        min-height: 40px;
        padding: 8px 14px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--border-light);
        background-color: #ffffff;
        color: var(--navy-900);
        font-size: 13.5px;
        font-weight: 600;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        white-space: nowrap;
        transition: background-color 150ms ease, border-color 150ms ease;
      }

      .btn-secondary:hover {
        background-color: var(--bg-subtle);
        border-color: var(--border-hover);
      }

      .btn-danger {
        min-height: 40px;
        padding: 8px 14px;
        border-radius: var(--radius-sm);
        border: 1px solid #fecaca;
        background-color: var(--danger-soft);
        color: var(--danger);
        font-size: 13.5px;
        font-weight: 600;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        white-space: nowrap;
      }

      .btn-danger:hover {
        background-color: #fee2e2;
      }

      .btn-modal-copy {
        min-height: 42px;
        padding: 0 20px;
        border-radius: var(--radius-sm);
        background-color: var(--accent-yellow);
        color: var(--navy-900);
        font-size: 14px;
        font-weight: 700;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        box-shadow: inset 0 -2px 0 rgba(15, 35, 71, 0.12);
        white-space: nowrap;
        transition: background-color 150ms ease;
      }

      .btn-modal-copy:hover {
        background-color: var(--accent-yellow-hover);
      }

      .btn-modal-copy.copied {
        background-color: var(--navy-900);
        color: #ffffff;
      }

      /* Form Styles inside Add/Edit Modal */
      .form-stack {
        display: flex;
        flex-direction: column;
        gap: 18px;
      }

      .form-field {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .form-label-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .form-label {
        font-size: 13.5px;
        font-weight: 700;
        color: var(--navy-900);
      }

      .form-counter {
        font-size: 12px;
        color: var(--text-muted);
        font-variant-numeric: tabular-nums;
      }

      .form-input,
      .form-select,
      .form-textarea {
        width: 100%;
        padding: 11px 14px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--border-light);
        background-color: #ffffff;
        font-size: 14.5px;
        color: var(--navy-900);
        transition: border-color 150ms ease, box-shadow 150ms ease;
      }

      .form-input:focus,
      .form-select:focus,
      .form-textarea:focus {
        outline: none;
        border-color: var(--navy-900);
        box-shadow: 0 0 0 3px var(--accent-yellow-soft);
      }

      .form-textarea {
        min-height: 360px;
        line-height: 1.7;
        resize: vertical;
      }

      .form-error {
        font-size: 13px;
        color: var(--danger);
        font-weight: 600;
        display: none;
      }

      .form-error.visible {
        display: block;
      }

      .hidden {
        display: none !important;
      }

      /* Auth & Admin Menu Controls */
      .btn-auth {
        height: 42px;
        padding: 0 14px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--border-light);
        background-color: #ffffff;
        color: var(--navy-900);
        font-size: 13.5px;
        font-weight: 700;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        white-space: nowrap;
        flex-shrink: 0;
        transition: background-color 150ms ease, border-color 150ms ease;
      }

      .btn-auth:hover {
        background-color: var(--bg-subtle);
        border-color: var(--navy-900);
      }

      .btn-logout {
        height: 42px;
        padding: 0 14px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--border-light);
        background-color: var(--bg-subtle);
        color: var(--navy-900);
        font-size: 13.5px;
        font-weight: 700;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        white-space: nowrap;
        flex-shrink: 0;
        transition: background-color 150ms ease, border-color 150ms ease;
      }

      .btn-logout:hover {
        background-color: var(--danger-soft);
        border-color: #fecaca;
        color: var(--danger);
      }

      .admin-controls-wrap {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-shrink: 0;
      }

      .auth-notice {
        max-width: 1160px;
        margin: 16px auto 0;
        padding: 0 24px;
      }

      .auth-notice-inner {
        background-color: var(--danger-soft);
        border: 1px solid #fecaca;
        color: var(--danger);
        border-radius: var(--radius-md);
        padding: 12px 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        font-size: 14px;
        font-weight: 700;
      }

      .auth-notice-close {
        width: 28px;
        height: 28px;
        border-radius: 6px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: var(--danger);
        font-size: 14px;
      }

      .auth-notice-close:hover {
        background-color: #fee2e2;
      }

      /* Admin Menu Section */
      .admin-panel {
        background-color: var(--bg-subtle);
        border: 1px solid var(--border-light);
        border-radius: var(--radius-lg);
        padding: 20px 22px;
        margin-bottom: 28px;
      }

      .admin-panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        flex-wrap: wrap;
        margin-bottom: 16px;
      }

      .admin-panel-title-group {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .admin-panel-title {
        font-size: 17px;
        font-weight: 800;
        color: var(--navy-900);
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .admin-panel-email {

        const currentUser = auth.currentUser;
        const errInfo = {
          error: error instanceof Error ? error.message : String(error),
          authInfo: {
            userId: currentUser?.uid ?? null,
            email: currentUser?.email ?? null,

        };

        if (isAdmin) {

          const result = await signInWithPopup(auth, googleProvider);
          const email = result.user?.email?.toLowerCase() || '';
          if (email !== ADMIN_EMAIL || result.user?.emailVerified === false) {
            await signOut(auth);
            isAdmin = false;
            syncAuthUI();
            showAuthNotice('관리자만 사용할 수 있어요');
            showToast('관리자만 사용할 수 있어요');

          }
          isAdmin = true;
          isAdminMenuOpen = true;
          syncAuthUI();
          showToast('관리자로 로그인했어요!');
        } catch (error) {
          if (error?.code !== 'auth/popup-closed-by-user' && error?.code !== 'auth/cancelled-popup-request') {

          if (email === ADMIN_EMAIL && user.emailVerified !== false) {

        let copied = false;
        try {
          if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(text);
            copied = true;
          }
        } catch {
          copied = false;
        }

        if (!copied) {
          const textarea = document.createElement('textarea');
          textarea.value = text;
          textarea.setAttribute('readonly', '');
          textarea.style.position = 'fixed';
          textarea.style.top = '-9999px';
          textarea.style.left = '-9999px';
          document.body.appendChild(textarea);
          textarea.select();
          try {
            copied = document.execCommand('copy');
          } catch {
            copied = false;
          }
          document.body.removeChild(textarea);
        }

        if (copied) {
          showToast('복사됐어요!');
          if (triggerButton) {
            const originalHTML = triggerButton.innerHTML;
            triggerButton.classList.add('copied');
            triggerButton.innerHTML = '<span>✓</span><span>복사됨</span>';
            setTimeout(() => {
              triggerButton.classList.remove('copied');
              triggerButton.innerHTML = originalHTML;
            }, 1400);
          }
        } else {
          showToast('복사에 실패했어요. 직접 선택해서 복사해 주세요.');
        }
      }

      // Render Admin Management List
      function renderAdminTable() {
        if (!isAdmin) {
          adminPromptTable.innerHTML = '';
          return;
        }

        if (prompts.length === 0) {
          adminPromptTable.innerHTML = `
            <div class="admin-row">
              <div class="admin-row-info">
                <span class="admin-row-title">등록된 프롬프트가 아직 없습니다.</span>
                <span class="admin-row-meta">위의 "새 프롬프트 추가" 버튼을 눌러 첫 프롬프트를 등록해 보세요.</span>
              </div>
            </div>
          `;
          return;
        }

        adminPromptTable.innerHTML = '';
        prompts.forEach((item, idx) => {
          const row = document.createElement('div');
          row.className = 'admin-row';

          const info = document.createElement('div');
          info.className = 'admin-row-info';

          const titleEl = document.createElement('div');
          titleEl.className = 'admin-row-title';
          titleEl.textContent = `#${idx + 1} ${item.title}`;

          const metaEl = document.createElement('div');
          metaEl.className = 'admin-row-meta';
          metaEl.textContent = `${getCategoryEmoji(item.category)} ${item.category} · ${item.content.length.toLocaleString('ko-KR')}자`;

          info.append(titleEl, metaEl);

          const btns = document.createElement('div');
          btns.className = 'admin-row-btns';

          const editBtn = document.createElement('button');
          editBtn.type = 'button';
          editBtn.className = 'btn-secondary btn-sm';
          editBtn.textContent = '✏️ 수정';
          editBtn.addEventListener('click', () => openEditorModal(item.id));

          const delBtn = document.createElement('button');
          delBtn.type = 'button';
          delBtn.className = 'btn-danger btn-sm';
          delBtn.textContent = '🗑️ 삭제';
          delBtn.addEventListener('click', () => openDeleteConfirmModal(item.id));

          btns.append(editBtn, delBtn);
          row.append(info, btns);
          adminPromptTable.appendChild(row);
        });
      }

      // Filtered Prompts
      function getFilteredPrompts() {
        const keyword = searchQuery.trim().toLowerCase();
        return prompts.filter((item) => {
          const matchesCategory = activeCategory === '전체' || item.category === activeCategory;
          if (!matchesCategory) return false;
          if (!keyword) return true;
          return (
            item.title.toLowerCase().includes(keyword) ||
            item.content.toLowerCase().includes(keyword)
          );
        });
      }

      // Render Category Filter Buttons
      function renderFilters() {
        filterBar.innerHTML = '';
        CATEGORIES.forEach((cat) => {
          const count =
            cat.id === '전체'
              ? prompts.length
              : prompts.filter((p) => p.category === cat.id).length;

          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = `filter-btn${activeCategory === cat.id ? ' active' : ''}`;
          btn.setAttribute('role', 'tab');
          btn.setAttribute('aria-selected', String(activeCategory === cat.id));

          const emojiSpan = document.createElement('span');
          emojiSpan.setAttribute('aria-hidden', 'true');
          emojiSpan.textContent = cat.emoji;

          const labelSpan = document.createElement('span');
          labelSpan.textContent = cat.label;

          const countSpan = document.createElement('span');
          countSpan.className = 'filter-count';
          countSpan.textContent = String(count);

          btn.append(emojiSpan, labelSpan, countSpan);
          btn.addEventListener('click', () => {
            activeCategory = cat.id;
            renderFilters();
            renderPromptList();
          });

          filterBar.appendChild(btn);
        });
      }

      // Render Prompt Cards
      function renderPromptList() {
        if (isLoading) return;

        const filtered = getFilteredPrompts();
        const totalCount = prompts.length;

        if (searchQuery.trim() || activeCategory !== '전체') {
          resultSummary.innerHTML = `<span>검색·분류 결과 <strong>${filtered.length}개</strong> (전체 ${totalCount}개)</span><span>만든 순서대로</span>`;
        } else {
          resultSummary.innerHTML = `<span>전체 프롬프트 <strong>${totalCount}개</strong></span><span>만든 순서대로</span>`;
        }

        if (filtered.length === 0) {
          const emptyBox = document.createElement('div');
          emptyBox.className = 'state-box';

          const emoji = document.createElement('div');
          emoji.className = 'state-emoji';
          emoji.textContent = searchQuery.trim() ? '🔎' : '📭';

          const title = document.createElement('div');
          title.className = 'state-title';
          title.textContent = searchQuery.trim()
            ? '검색 결과가 없습니다'
            : '등록된 프롬프트가 없어요';

          const desc = document.createElement('div');
          desc.className = 'state-desc';
          desc.textContent = searchQuery.trim()
            ? '다른 단어로 검색하거나 전체 분류를 눌러 확인해 보세요.'
            : isAdmin
              ? '관리자 메뉴에서 "새 프롬프트 추가" 버튼을 눌러 프롬프트를 등록해 보세요.'
              : '관리자가 프롬프트를 등록하면 여기에 표시됩니다.';

          emptyBox.append(emoji, title, desc);

          if (searchQuery.trim() || activeCategory !== '전체') {
            const resetBtn = document.createElement('button');
            resetBtn.type = 'button';
            resetBtn.className = 'btn-secondary';
            resetBtn.textContent = '전체 보기';
            resetBtn.addEventListener('click', () => {
              activeCategory = '전체';
              searchQuery = '';
              searchInput.value = '';
              searchClearBtn.classList.remove('visible');
              renderFilters();
              renderPromptList();
            });
            emptyBox.appendChild(resetBtn);
          }

          promptListContainer.innerHTML = '';
          promptListContainer.appendChild(emptyBox);
          return;
        }

        const grid = document.createElement('div');
        grid.className = 'prompt-grid';

        filtered.forEach((item) => {
          const originalIndex = prompts.findIndex((p) => p.id === item.id) + 1;

          const card = document.createElement('article');
          card.className = 'prompt-card';
          card.tabIndex = 0;
          card.setAttribute('role', 'button');
          card.setAttribute('aria-label', `${item.title} 전체 보기`);

          const cardTop = document.createElement('div');
          cardTop.className = 'card-top';

          const meta = document.createElement('div');
          meta.className = 'card-meta';

          const metaLeft = document.createElement('span');
          metaLeft.className = 'card-meta-left';
          metaLeft.textContent = `${getCategoryEmoji(item.category)} ${item.category} · ${item.content.length.toLocaleString('ko-KR')}자`;

          const metaNum = document.createElement('span');
          metaNum.className = 'card-meta-num';
          metaNum.textContent = `#${originalIndex}`;

          meta.append(metaLeft, metaNum);

          const titleEl = document.createElement('h2');
          titleEl.className = 'card-title';
          titleEl.textContent = item.title;

          const previewEl = document.createElement('p');
          previewEl.className = 'card-preview';
          previewEl.textContent = item.content;

          cardTop.append(meta, titleEl, previewEl);

          const footer = document.createElement('div');
          footer.className = 'card-footer';

          const hintEl = document.createElement('span');
          hintEl.className = 'card-hint';
          hintEl.textContent = '눌러서 전체 보기';

          const copyBtn = document.createElement('button');
          copyBtn.type = 'button';
          copyBtn.className = 'btn-copy';
          copyBtn.innerHTML = '<span aria-hidden="true">📋</span><span>복사</span>';
          copyBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            copyText(item.content, copyBtn);
          });

          footer.append(hintEl, copyBtn);
          card.append(cardTop, footer);

          card.addEventListener('click', () => openDetailModal(item.id));
          card.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              openDetailModal(item.id);
            }
          });

          grid.appendChild(card);
        });

        promptListContainer.innerHTML = '';
        promptListContainer.appendChild(grid);
      }

      function showErrorState(message) {
        isLoading = false;
        resultSummary.innerHTML = '<span>연결 오류</span>';
        promptListContainer.innerHTML = `
          <div class="state-box">
            <div class="state-emoji">⚠️</div>
            <div class="state-title">문제가 발생했어요</div>
            <div class="state-desc">${message}</div>
          </div>
        `;
      }

      // Detail Modal Logic
      function openDetailModal(promptId) {
        const item = prompts.find((p) => p.id === promptId);
        if (!item) return;

        activePromptId = promptId;
        detailMeta.textContent = `${getCategoryEmoji(item.category)} ${item.category} · ${item.content.length.toLocaleString('ko-KR')}자`;
        detailTitle.textContent = item.title;
        detailContent.textContent = item.content;
        detailAdminActions.classList.toggle('hidden', !isAdmin);
        detailModal.classList.add('open');
        document.body.style.overflow = 'hidden';
      }

      function closeDetailModal() {
        activePromptId = null;
        detailModal.classList.remove('open');
        if (!editorModal.classList.contains('open') && !confirmDeleteModal.classList.contains('open')) {
          document.body.style.overflow = '';
        }
      }

      detailCopyBtn.addEventListener('click', () => {
        const item = prompts.find((p) => p.id === activePromptId);
        if (item) copyText(item.content, detailCopyBtn);
      });

      closeDetailModalBtn.addEventListener('click', closeDetailModal);
      detailModal.addEventListener('click', (e) => {
        if (e.target === detailModal) closeDetailModal();
      });

      editPromptBtn.addEventListener('click', () => {
        if (!isAdmin) {
          denyGuestWrite();
          return;
        }
        const item = prompts.find((p) => p.id === activePromptId);
        if (!item) return;
        const idToEdit = item.id;
        closeDetailModal();
        openEditorModal(idToEdit);
      });

      deletePromptBtn.addEventListener('click', () => {
        if (!isAdmin) {
          denyGuestWrite();
          return;
        }
        if (!activePromptId) return;
        openDeleteConfirmModal(activePromptId);
      });

      // Delete Confirmation Modal Logic
      function openDeleteConfirmModal(promptId) {
        if (!isAdmin) {
          denyGuestWrite();
          return;
        }
        const item = prompts.find((p) => p.id === promptId);
        if (!item) return;
        pendingDeleteId = promptId;
        confirmDeleteDesc.textContent = `"${item.title}" 프롬프트가 영구적으로 삭제됩니다.`;
        confirmDeleteModal.classList.add('open');
        document.body.style.overflow = 'hidden';
      }

      function closeDeleteConfirmModal() {
        pendingDeleteId = null;
        confirmDeleteModal.classList.remove('open');
        if (!detailModal.classList.contains('open') && !editorModal.classList.contains('open')) {
          document.body.style.overflow = '';
        }
      }

      cancelDeleteBtn.addEventListener('click', closeDeleteConfirmModal);
      confirmDeleteModal.addEventListener('click', (e) => {
        if (e.target === confirmDeleteModal) closeDeleteConfirmModal();
      });

      confirmDeleteBtn.addEventListener('click', async () => {
        if (!isAdmin) {
          denyGuestWrite();
          return;
        }
        if (!pendingDeleteId) return;
        const targetId = pendingDeleteId;
        confirmDeleteBtn.disabled = true;
        try {
          await deleteDoc(doc(db, 'prompts', targetId));
          closeDeleteConfirmModal();
          if (activePromptId === targetId) {
            closeDetailModal();
          }
          showToast('프롬프트가 삭제되었어요.');
        } catch (error) {
          const msg = error instanceof Error ? error.message : String(error);
          if (error?.code === 'permission-denied' || msg.toLowerCase().includes('permission')) {
            denyGuestWrite();
          } else {
            showToast('삭제에 실패했어요.');
          }
          handleFirestoreError(error, OperationType.DELETE, `prompts/${targetId}`);
        } finally {
          confirmDeleteBtn.disabled = false;
        }
      });

      // Add / Edit Modal Logic (Admin only)
      function updateCounters() {
        titleCounter.textContent = `${inputTitle.value.length} / 100`;
        contentCounter.textContent = `${inputContent.value.length.toLocaleString('ko-KR')} / 10,000자`;
      }

      function openEditorModal(promptId = null) {
        if (!isAdmin) {
          denyGuestWrite();
          return;
        }
        editingPromptId = promptId;
        formErrorMsg.classList.remove('visible');
        formErrorMsg.textContent = '';

        if (promptId) {
          const item = prompts.find((p) => p.id === promptId);
          if (!item) return;
          editorModalHeading.textContent = '프롬프트 수정';
          inputTitle.value = item.title;
          inputCategory.value = item.category;
          inputContent.value = item.content;
        } else {
          editorModalHeading.textContent = '새 프롬프트 추가';
          inputTitle.value = '';
          inputCategory.value = activeCategory === '전체' ? '사진 합성' : activeCategory;
          inputContent.value = '';
        }

        updateCounters();
        editorModal.classList.add('open');
        document.body.style.overflow = 'hidden';
        setTimeout(() => inputTitle.focus(), 50);
      }

      function closeEditorModal() {
        editingPromptId = null;
        editorModal.classList.remove('open');
        if (!detailModal.classList.contains('open') && !confirmDeleteModal.classList.contains('open')) {
          document.body.style.overflow = '';
        }
      }

      openAddModalBtn.addEventListener('click', () => openEditorModal(null));
      closeEditorModalBtn.addEventListener('click', closeEditorModal);
      cancelEditorBtn.addEventListener('click', closeEditorModal);
      editorModal.addEventListener('click', (e) => {
        if (e.target === editorModal) closeEditorModal();
      });

      inputTitle.addEventListener('input', updateCounters);
      inputContent.addEventListener('input', updateCounters);

      promptForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        if (!isAdmin) {
          denyGuestWrite();
          return;
        }

        const title = inputTitle.value.trim();
        const category = inputCategory.value;
        const content = inputContent.value;

        if (!title) {
          formErrorMsg.textContent = '제목을 입력해 주세요.';
          formErrorMsg.classList.add('visible');
          return;
        }
        if (title.length > 100) {
          formErrorMsg.textContent = '제목은 100자 이내로 입력해 주세요.';
          formErrorMsg.classList.add('visible');
          return;
        }
        if (!content.trim()) {
          formErrorMsg.textContent = '프롬프트 내용을 입력해 주세요.';
          formErrorMsg.classList.add('visible');
          return;
        }
        if (content.length > 10000) {
          formErrorMsg.textContent = '내용은 10,000자 이내로 입력해 주세요.';
          formErrorMsg.classList.add('visible');
          return;
        }

        savePromptBtn.disabled = true;
        savePromptBtn.textContent = '저장 중...';
        formErrorMsg.classList.remove('visible');

        try {
          if (editingPromptId) {
            const targetId = editingPromptId;
            await updateDoc(doc(db, 'prompts', targetId), {
              title,
              category,
              content
            });
            closeEditorModal();
            showToast('프롬프트가 수정되었어요!');
          } else {
            await addDoc(collection(db, 'prompts'), {
              title,
              category,
              content,
              createdAt: serverTimestamp()
            });
            closeEditorModal();
            showToast('새 프롬프트가 저장되었어요!');
          }
        } catch (error) {
          const msg = error instanceof Error ? error.message : String(error);
          if (error?.code === 'permission-denied' || msg.toLowerCase().includes('permission')) {
            formErrorMsg.textContent = '관리자만 할 수 있어요';
            denyGuestWrite();
          } else {
            formErrorMsg.textContent = '저장에 실패했습니다. 입력 길이와 네트워크를 확인해 주세요.';
          }
          formErrorMsg.classList.add('visible');
          handleFirestoreError(
            error,
            editingPromptId ? OperationType.UPDATE : OperationType.CREATE,
            editingPromptId ? `prompts/${editingPromptId}` : 'prompts'
          );
        } finally {
          savePromptBtn.disabled = false;
          savePromptBtn.textContent = '💾 저장하기';
        }
      });

      // Search Input Events
      searchInput.addEventListener('input', (e) => {
        searchQuery = e.target.value;
        searchClearBtn.classList.toggle('visible', searchQuery.length > 0);
        renderPromptList();
      });

      searchClearBtn.addEventListener('click', () => {
        searchQuery = '';
        searchInput.value = '';
        searchClearBtn.classList.remove('visible');
        searchInput.focus();
        renderPromptList();
      });

      // Escape Key Closes Modals
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          if (confirmDeleteModal.classList.contains('open')) {
            closeDeleteConfirmModal();
            return;
          }
          if (editorModal.classList.contains('open')) {
            closeEditorModal();
            return;
          }
          if (detailModal.classList.contains('open')) {
            closeDetailModal();
          }
        }
      });

      // Initialize App & Subscribe to Firestore (No sample auto-seeding)
      async function initApp() {
        renderFilters();
        syncAuthUI();
        await testConnection();

        const promptsQuery = query(collection(db, 'prompts'), orderBy('createdAt', 'asc'));
        onSnapshot(
          promptsQuery,
          (snapshot) => {
            prompts = snapshot.docs.map((d) => {
              const data = d.data();
              return {
                id: d.id,
                title: data.title || '',
                category: data.category || '사진 합성',
                content: data.content || '',
                createdAt: data.createdAt || null
              };
            });
            isLoading = false;
            renderFilters();
            renderAdminTable();
            renderPromptList();

            // Refresh open detail modal if updated
            if (activePromptId && detailModal.classList.contains('open')) {
              const updated = prompts.find((p) => p.id === activePromptId);
              if (updated) {
                detailMeta.textContent = `${getCategoryEmoji(updated.category)} ${updated.category} · ${updated.content.length.toLocaleString('ko-KR')}자`;
                detailTitle.textContent = updated.title;
                detailContent.textContent = updated.content;
              }
            }
          },
          (error) => {
            showErrorState('프롬프트를 불러오는 중 권한 또는 네트워크 오류가 발생했습니다.');
            handleFirestoreError(error, OperationType.LIST, 'prompts');
          }
        );
      }

      initApp();
    </script>
  </body>
</html>
